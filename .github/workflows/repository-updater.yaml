---
name: Repository Updater

# yamllint disable-line rule:truthy
on:
  repository_dispatch:
    types: ["update"]

permissions:
  contents: read

jobs:
  update:
    name: Publish app update
    runs-on: ubuntu-latest
    steps:
      - name: Run Repository Updater
        uses: hassio-addons/repository-updater@88408cfe4468560e649cb9c227431a696c9298ea
        with:
          app: ${{ github.event.client_payload.app }}
          repository: ${{ github.repository }}
          token: ${{ secrets.UPDATER_TOKEN }}
        env:
          GIT_AUTHOR_NAME: CJ Ramseyer
          GIT_AUTHOR_EMAIL: 48690692+cjramseyer@users.noreply.github.com
          GIT_COMMITTER_NAME: CJ Ramseyer
          GIT_COMMITTER_EMAIL: 48690692+cjramseyer@users.noreply.github.com
